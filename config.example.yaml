# agent-memory-server — non-secret configuration example.
# Copy this file to config.yaml if you want to override the defaults.
# config.yaml is gitignored.

# Registered agent personas. `id` is the canonical key used in prompt files
# (e.g. id=default → prompts/default.md loaded first, falling back to
# default.example.md). `display_name` is only used in status / notification
# messages.
agents:
  - id: default
    display_name: Default
  - id: engineer
    display_name: Engineer
  - id: analyst
    display_name: Analyst
  - id: planner
    display_name: Planner

# Default assignee when an instruction arrives without an explicit target.
default_assignee: default

# Example subject list for the study-progress map endpoint. Replace with the
# categories relevant to your workflow.
study_map_subjects:
  - Category A
  - Category B
  - Category C
